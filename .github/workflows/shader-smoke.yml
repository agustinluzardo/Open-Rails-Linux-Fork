name: Shader smoke

on:
  push:
    branches: [native-openrails-port]
    paths:
      - 'Source/RunActivity/Content/*.fx'
      - '.config/dotnet-tools.json'
      - '.github/workflows/shader-smoke.yml'
  workflow_dispatch:

concurrency:
  group: native-openrails-shaders
  cancel-in-progress: true

jobs:
  shaders:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile current Open Rails shaders for DesktopGL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool restore
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\shaders" | Out-Null
          Get-ChildItem "Source\RunActivity\Content\*.fx" | ForEach-Object {
            $prepared = Join-Path "$env:RUNNER_TEMP" $_.Name
            $source = [IO.File]::ReadAllText($_.FullName)
            $source = $source.Replace('vs_5_0','vs_3_0').Replace('ps_5_0','ps_3_0').Replace('vs_4_0_level_9_1','vs_3_0').Replace('ps_4_0_level_9_1','ps_3_0')
            [IO.File]::WriteAllText($prepared, $source)
            $out = Join-Path "$env:RUNNER_TEMP\shaders" ($_.BaseName + ".mgfx")
            Write-Host "Compiling $($_.Name)"
            dotnet tool run mgfxc $prepared $out /Profile:OpenGL
            if ($LASTEXITCODE -ne 0) { throw "mgfxc failed for $($_.Name)" }
          }
          @('SceneryShader','PrecipitationShader','LightGlowShader','DebugShader') | ForEach-Object {
            if (-not (Test-Path "$env:RUNNER_TEMP\shaders\$_.mgfx")) { throw "Missing $_.mgfx" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: openrails-opengl-shaders
          path: ${{ runner.temp }}\shaders\*.mgfx
          if-no-files-found: error
