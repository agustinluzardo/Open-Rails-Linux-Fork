name: Launcher interface

on:
  push:
    branches: [main]
    paths:
      - 'Source/Launcher.Gui/**'
      - 'Source/Launcher.Core/**'
      - 'Source/Test/Tests.Launcher.Gui/**'
      - 'Source/Locales/Launcher.Gui/**'
      - '.github/workflows/launcher-ui.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Source/Launcher.Gui/**'
      - 'Source/Launcher.Core/**'
      - 'Source/Test/Tests.Launcher.Gui/**'
      - 'Source/Locales/Launcher.Gui/**'
      - '.github/workflows/launcher-ui.yml'
  workflow_dispatch:

concurrency:
  group: launcher-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  interface:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify and render the launcher
        working-directory: Source
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
          AVALONIA_TELEMETRY_OPTOUT: '1'
          NUGET_PACKAGES: ${{ runner.temp }}/riel-nuget
        run: |
          set -euo pipefail
          dotnet test Test/Tests.Launcher.Gui/Tests.Launcher.Gui.csproj -c Release
          dotnet publish Launcher.Gui/Launcher.Gui.csproj -c Release -r linux-x64 --self-contained true -o "${RUNNER_TEMP}/riel-launcher"
          : > "$GITHUB_ENV"
      - name: Upload actual launcher renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-ui-preview
          path: ${{ runner.temp }}/riel-launcher-previews/*.png
          if-no-files-found: warn
          retention-days: 14
