name: Native Open Rails port CI

on:
  push:
    branches: [native-openrails-port]
  workflow_dispatch:

jobs:
  linux-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build RunActivity with DesktopGL
        working-directory: Source
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          set -euo pipefail
          dotnet build RunActivity/RunActivity.csproj -c Release -p:RielPlatform=linux -p:RielGraphicsBackend=DesktopGL
