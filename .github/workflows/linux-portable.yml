name: Portable Linux package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: riel-main-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shaders:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile Open Rails shaders for DesktopGL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet tool restore
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\shaders" | Out-Null
          Get-ChildItem "Source\RunActivity\Content\*.fx" | ForEach-Object {
            $prepared = Join-Path "$env:RUNNER_TEMP" $_.Name
            $source = [IO.File]::ReadAllText($_.FullName)
            $source = $source.Replace('vs_5_0','vs_3_0').Replace('ps_5_0','ps_3_0')
            $source = $source.Replace('vs_4_0_level_9_1','vs_3_0').Replace('ps_4_0_level_9_1','ps_3_0')
            $source = $source.Replace('vs_4_0_level_9_3','vs_3_0').Replace('ps_4_0_level_9_3','ps_3_0')
            [IO.File]::WriteAllText($prepared, $source)
            $out = Join-Path "$env:RUNNER_TEMP\shaders" ($_.BaseName + ".mgfx")
            dotnet tool run mgfxc $prepared $out /Profile:OpenGL
            if ($LASTEXITCODE -ne 0) { throw "mgfxc failed for $($_.Name)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: openrails-opengl-shaders
          path: ${{ runner.temp }}\shaders\*.mgfx
          if-no-files-found: error

  linux-x64:
    needs: shaders
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            10.0.x

      - name: Test native Open Rails
        working-directory: Source
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
          AVALONIA_TELEMETRY_OPTOUT: '1'
        run: |
          set -euo pipefail
          dotnet test Tests/Tests.csproj -c Release -p:RielPlatform=linux -p:RielGraphicsBackend=DesktopGL
          dotnet build RunActivity/RunActivity.csproj -c Release -p:RielPlatform=linux -p:RielGraphicsBackend=DesktopGL

      - name: Install Linux audio runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopenal1 libsndio7.0 patchelf

      - name: Publish native engine and launchers
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
          AVALONIA_TELEMETRY_OPTOUT: '1'
        run: |
          set -euo pipefail
          publish="${RUNNER_TEMP}/riel-publish"
          mkdir -p "$publish/engine/Content"

          # The engine still targets .NET 6 while the Linux launchers target .NET 10.
          # Keep their self-contained runtimes in different directories: publishing them
          # into one directory overwrites framework DLLs and creates an unloadable hybrid.
          dotnet publish Source/RunActivity/RunActivity.csproj -c Release -r linux-x64 --self-contained true \
            -p:RielPlatform=linux -p:RielGraphicsBackend=DesktopGL -p:IsPublishable=true -o "$publish/engine"
          dotnet publish Source/Launcher.Cli/Launcher.Cli.csproj -c Release -r linux-x64 --self-contained true \
            -p:RielPlatform=linux -o "$publish"
          dotnet publish Source/Launcher.Gui/Launcher.Gui.csproj -c Release -r linux-x64 --self-contained true \
            -p:RielPlatform=linux -o "$publish"

          openal="$(ldconfig -p | awk '/libopenal\.so\.1 \(libc6,x86-64\)/ { print $NF; exit }')"
          sndio="$(ldconfig -p | awk '/libsndio\.so\.7 \(libc6,x86-64\)/ { print $NF; exit }')"
          test -n "$openal"
          test -n "$sndio"
          cp -L "$openal" "$publish/engine/libopenal.so.1"
          cp -L "$sndio" "$publish/engine/libsndio.so.7"
          # Make OpenAL resolve its bundled helper library beside itself instead of
          # depending on the target distribution to have Ubuntu's sndio ABI installed.
          patchelf --set-rpath '$ORIGIN' "$publish/engine/libopenal.so.1"
          cp /usr/share/doc/libopenal1/copyright "$publish/engine/OPENAL-LICENSE.txt"

      - uses: actions/download-artifact@v4
        with:
          name: openrails-opengl-shaders
          path: ${{ runner.temp }}/riel-publish/engine/Content

      - name: Package and verify without an installed .NET runtime
        env:
          DOTNET_ROOT: /nonexistent-dotnet-runtime
          DOTNET_MULTILEVEL_LOOKUP: '0'
          XDG_CONFIG_HOME: ${{ runner.temp }}/riel-profile/config
          XDG_DATA_HOME: ${{ runner.temp }}/riel-profile/data
          XDG_STATE_HOME: ${{ runner.temp }}/riel-profile/state
          XDG_CACHE_HOME: ${{ runner.temp }}/riel-profile/cache
        run: |
          set -euo pipefail
          publish="${RUNNER_TEMP}/riel-publish"
          bundle="${RUNNER_TEMP}/riel-linux-x64"

          test -x "$publish/engine/RunActivity"
          test -x "$publish/riel"
          test -x "$publish/riel-gui"
          file "$publish/engine/RunActivity" | grep -q 'ELF 64-bit'
          test -s "$publish/engine/System.Net.Http.dll"
          test -s "$publish/engine/System.Security.Cryptography.Algorithms.dll"
          test -s "$publish/engine/libopenal.so.1"
          test -s "$publish/engine/libsndio.so.7"
          test "$(patchelf --print-rpath "$publish/engine/libopenal.so.1")" = '$ORIGIN'
          strings "$publish/engine/RunActivity.dll" | grep -q 'libopenal.so.1'
          if ldd "$publish/engine/libopenal.so.1" | grep -q 'not found'; then
            echo "Bundled OpenAL has unresolved native dependencies" >&2
            ldd "$publish/engine/libopenal.so.1" >&2
            exit 1
          fi
          test -s "$publish/System.Net.Http.dll"
          test -s "$publish/System.Security.Cryptography.dll"
          strings "$publish/engine/System.Net.Http.dll" | grep -q 'Version=6.0.0.0'
          strings "$publish/System.Net.Http.dll" | grep -q 'Version=10.0.0.0'
          grep -q '"tfm": "net6.0"' "$publish/engine/RunActivity.runtimeconfig.json"
          grep -q '"version": "6.0.' "$publish/engine/RunActivity.runtimeconfig.json"
          grep -q '"tfm": "net10.0"' "$publish/riel.runtimeconfig.json"
          grep -q '"version": "10.0.' "$publish/riel.runtimeconfig.json"
          for shader in CabShader DebugShader DriverMachineInterfaceShader LightConeShader LightGlowShader Loading ParticleEmitterShader PopupWindow PrecipitationShader SceneryShader ShadowMap SkyShader; do
            test -s "$publish/engine/Content/$shader.mgfx"
          done

          mkdir -p "$bundle/app"
          cp -a "$publish/." "$bundle/app/"
          install -m 755 packaging/linux/riel-portable "$bundle/riel"
          find "$bundle/app" -type f \( -name '*.pdb' -o -name '*.dbg' \) -delete
          for runtime_dir in "$bundle/app/runtimes" "$bundle/app/engine/runtimes"; do
            if [ -d "$runtime_dir" ]; then
              find "$runtime_dir" -mindepth 1 -maxdepth 1 ! -name linux-x64 ! -name unix -exec rm -rf {} +
            fi
          done

          "$bundle/riel" version
          "$bundle/riel" content

          tar -czf "${RUNNER_TEMP}/riel-linux-x64.tar.gz" -C "${RUNNER_TEMP}" riel-linux-x64
          (cd "${RUNNER_TEMP}" && zip -qr riel-linux-x64.zip riel-linux-x64)
          (cd "${RUNNER_TEMP}" && sha256sum riel-linux-x64.zip > riel-linux-x64.zip.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: riel-linux-x64
          path: ${{ runner.temp }}/riel-linux-x64.tar.gz
          if-no-files-found: error

      - name: Publish tested main build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "main-${GITHUB_SHA:0:12}" \
            "${RUNNER_TEMP}/riel-linux-x64.zip" \
            "${RUNNER_TEMP}/riel-linux-x64.zip.sha256" \
            --prerelease --latest=false --title "Riel main ${GITHUB_SHA:0:12}" \
            --notes "Native Linux Riel build based on Open Rails upstream. Includes .NET runtime and DesktopGL shaders."
