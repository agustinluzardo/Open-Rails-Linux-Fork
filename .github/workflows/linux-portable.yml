name: Portable Linux package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning reads the repository history.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Rebuild OpenGL shaders
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64
          ./scripts/build-shaders.sh --profile OpenGL --output Source/Shaders/prebuilt/OpenGL --check
      - name: Build, test and publish
        working-directory: Source
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
          AVALONIA_TELEMETRY_OPTOUT: '1'
          NUGET_PACKAGES: ${{ runner.temp }}/riel-nuget
        run: |
          set -euo pipefail
          dotnet test Test/Tests.Orts/Tests.Orts.csproj -c Release
          dotnet test Test/Tests.Riel/Tests.Riel.csproj -c Release
          for project in \
            ActivityRunner/ActivityRunner.csproj \
            Launcher.Cli/Launcher.Cli.csproj \
            Launcher.Gui/Launcher.Gui.csproj \
            MultiPlayer.Hub/MultiPlayer.Hub.csproj
          do
            dotnet publish "$project" -c Release -r linux-x64 --self-contained true \
              -o "${RUNNER_TEMP}/riel-publish"
          done
          # Nothing from this build step needs to be exported to later steps.
          # A build tool can leave non-environment text in GitHub's command file;
          # GitHub rejects the entire successful step when it parses that text.
          : > "$GITHUB_ENV"
      - name: Install Qt for Riel Route Editor
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.1"
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtwebsockets
          cache: true
          setup-python: false

      - name: Build native Riel Route Editor
        env:
          TSRE5VC_COMMIT: 15a5d148a15ad305e14a9e602961210ad18ada74
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build g++ \
            libopenal-dev libgl1-mesa-dev

          editor_src="${RUNNER_TEMP}/tsre5vc"
          editor_build="${RUNNER_TEMP}/tsre5vc-build"
          editor_out="${RUNNER_TEMP}/riel-route-editor"

          git clone --filter=blob:none https://github.com/GokuMK/TSRE5vc.git "$editor_src"
          git -C "$editor_src" checkout --detach "$TSRE5VC_COMMIT"
          python3 scripts/prepare-route-editor-source.py "$editor_src"

          riel_version="$(python3 -c 'import json; print(json.load(open("Source/version.json"))["version"])')"
          cmake -S "$editor_src" -B "$editor_build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DTSRE5_VERSION="$riel_version+${GITHUB_SHA:0:12}" \
            -DTSRE_BUILD_ACE_TESTS=OFF \
            -DTSRE_BUILD_TOKEN_TESTS=OFF \
            -DTSRE_BUILD_SHAPE_TESTS=OFF \
            -DTSRE_BUILD_CONTENT_CASE_TESTS=OFF \
            -DTSRE_BUILD_GEO_TESTS=OFF
          cmake --build "$editor_build" --parallel

          scripts/bundle-route-editor-linux.sh "$editor_build/TSRE5vc" "$editor_out"
          cp -a "$editor_src/appdata" "$editor_out/appdata"
          cp Source/Launcher.Gui/Assets/riel.png "$editor_out/riel-route-editor.png"
          cp LICENSE "$editor_out/LICENSE-GPL-3.0.txt"
          cp docs/route-editor.md "$editor_out/README.md"
          cat > "$editor_out/SOURCE.txt" <<EOF
          Riel Route Editor is built from TSRE5vc.
          Upstream: https://github.com/GokuMK/TSRE5vc
          Commit: $TSRE5VC_COMMIT
          Riel integration patch: scripts/prepare-route-editor-source.py
          License: GNU GPL 3.0 or later (see upstream source headers and LICENSE-GPL-3.0.txt)
          Settings: ~/.local/share/Riel/RouteEditor/settings.json on a default Linux desktop
          EOF

          tar --exclude=.git -czf "${RUNNER_TEMP}/riel-route-editor-source.tar.gz" -C "${RUNNER_TEMP}" tsre5vc

          QT_QPA_PLATFORM=offscreen "$editor_out/riel-route-editor" --version
          QT_QPA_PLATFORM=offscreen "$editor_out/riel-route-editor" --test-list
      - name: Package and verify without an installed .NET runtime
        env:
          DOTNET_ROOT: /nonexistent-dotnet-runtime
          DOTNET_MULTILEVEL_LOOKUP: '0'
          XDG_CONFIG_HOME: ${{ runner.temp }}/riel-profile/config
          XDG_DATA_HOME: ${{ runner.temp }}/riel-profile/data
          XDG_STATE_HOME: ${{ runner.temp }}/riel-profile/state
          XDG_CACHE_HOME: ${{ runner.temp }}/riel-profile/cache
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/riel-linux-x64"
          mkdir -p "$bundle/app"
          cp -a "${RUNNER_TEMP}/riel-publish/." "$bundle/app/"
          mkdir -p "$bundle/app/route-editor"
          cp -a "${RUNNER_TEMP}/riel-route-editor/." "$bundle/app/route-editor/"
          install -m 755 packaging/linux/riel-portable "$bundle/riel"
          find "$bundle/app" -type f \( -name '*.pdb' -o -name '*.dbg' \) -delete
          if [ -d "$bundle/app/runtimes" ]; then
            find "$bundle/app/runtimes" -mindepth 1 -maxdepth 1 \
              ! -name linux-x64 ! -name unix -exec rm -rf {} +
          fi
          python3 Source/Tools/TestRoute/make_test_route.py "${RUNNER_TEMP}/riel-test-content"
          "$bundle/riel" content add Test "${RUNNER_TEMP}/riel-test-content/Train Simulator"
          "$bundle/riel" content list | grep -F Test
          # The portable wrapper must keep finding app/ when invoked through PATH.
          mkdir -p "${RUNNER_TEMP}/riel-path"
          ln -s "$bundle/riel" "${RUNNER_TEMP}/riel-path/riel"
          PATH="${RUNNER_TEMP}/riel-path:$PATH" riel version
          test -x "$bundle/app/route-editor/riel-route-editor"
          test -f "$bundle/app/route-editor/LICENSE-GPL-3.0.txt"
          QT_QPA_PLATFORM=offscreen "$bundle/app/route-editor/riel-route-editor" --version
          QT_QPA_PLATFORM=offscreen "$bundle/app/route-editor/riel-route-editor" --test-list
          "$bundle/riel" route-editor --version
          tar -czf "${RUNNER_TEMP}/riel-linux-x64.tar.gz" -C "${RUNNER_TEMP}" riel-linux-x64
          (cd "${RUNNER_TEMP}" && zip -qr riel-linux-x64.zip riel-linux-x64)
          (cd "${RUNNER_TEMP}" && sha256sum riel-linux-x64.zip > riel-linux-x64.zip.sha256)
          du -h "${RUNNER_TEMP}/riel-linux-x64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: riel-linux-x64
          path: |
            ${{ runner.temp }}/riel-linux-x64.tar.gz
            ${{ runner.temp }}/riel-route-editor-source.tar.gz
          if-no-files-found: error
      - name: Publish tested main build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="main-${GITHUB_SHA:0:12}"
          title="Riel main ${GITHUB_SHA:0:12}"
          notes="Portable Linux build of ${GITHUB_SHA}. Includes the .NET runtime and native Riel editor suite. Matching editor source is attached."

          if gh release view "$tag" >/dev/null 2>&1; then
            # A force-push/rollback can legitimately rebuild a commit whose
            # release tag already exists. Refresh its assets instead of failing.
            gh release upload "$tag" \
              "${RUNNER_TEMP}/riel-linux-x64.zip" \
              "${RUNNER_TEMP}/riel-linux-x64.zip.sha256" \
              "${RUNNER_TEMP}/riel-route-editor-source.tar.gz" \
              --clobber
            gh release edit "$tag" --prerelease --latest=false --title "$title" --notes "$notes"
          else
            gh release create "$tag" \
              "${RUNNER_TEMP}/riel-linux-x64.zip" \
              "${RUNNER_TEMP}/riel-linux-x64.zip.sha256" \
              "${RUNNER_TEMP}/riel-route-editor-source.tar.gz" \
              --prerelease --latest=false --title "$title" --notes "$notes"
          fi
      - name: Publish stable release for tested version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("Source/version.json"))["version"])')"
          if [[ "$version" == *-* || "$version" == *'{'* ]]; then
            echo "Development version $version; no stable release"
            exit 0
          fi
          release_notes() {
            local release_tag="$1"
            local release_sha="$2"
            case "$release_tag" in
              v0.1.0)
                printf '%b\n' "Stable portable Linux build of ${release_sha}, with bundled .NET runtime.\n\n### Highlights\n- First stable Riel Linux release.\n- Renamed the public assemblies, namespaces and common library from \`FreeTrainSimulator.*\` to \`Riel.*\`.\n- Kept launcher/update checks working through the repository rename.\n- Hardened Linux activity testing so startup failures are logged and batch testing can continue.\n- Improved native AI train visual loading, nearby-train prioritization and related diagnostics.\n- Added the F3 system information overlay and Linux temperature reporting.\n\n### Compatibility / known issues\n- Bundled Riel assemblies already use the \`Riel.*\` names.\n- Only third-party add-on DLLs built against legacy \`FreeTrainSimulator.*\` assemblies require rebuilding.\n- Older saves made before the assembly rename have not been fully verified.\n- Known route-content issue: the signal between Quilmes and Ezpeleta can display green while the route treats it as red."
                ;;
              v0.1.1)
                printf '%b\n' "Stable portable Linux build of ${release_sha}, with bundled .NET runtime.\n\n### Changes\n- Adjusted the particle vertex layout/stride handling as an OpenGL compatibility step for smoke rendering.\n- Bumped the stable version to 0.1.1.\n\n### Note\n- This was an intermediate particle-rendering fix. The final DesktopGL billboard fix that makes smoke/steam/spray particles visible landed in Riel 0.1.2.\n\n### Compatibility / known issues\n- Bundled Riel assemblies already use the \`Riel.*\` names.\n- Only third-party add-on DLLs built against legacy \`FreeTrainSimulator.*\` assemblies require rebuilding.\n- Older saves have not been fully verified.\n- Known route-content issue: the signal between Quilmes and Ezpeleta can display green while the route treats it as red."
                ;;
              v0.1.2)
                printf '%b\n' "Stable portable Linux build of ${release_sha}, with bundled .NET runtime.\n\n### Particle rendering fixes\n- Fixed the particle-emitter ring-buffer indexing/off-by-one issue.\n- Restored the Open Rails 80-byte particle vertex stride.\n- Added particle/diesel exhaust diagnostics and exposed them in Settings.\n- Added recovery when DesktopGL invalidates a dynamic particle vertex buffer.\n- Fixed the actual DesktopGL billboard shader bug: static corner arrays could be compiled as zeroed uniforms, collapsing every particle quad to zero area.\n- Smoke, steam and other effects using the generic particle emitter can now render correctly on native Linux/OpenGL.\n\n### Compatibility / known issues\n- Bundled Riel assemblies already use the \`Riel.*\` names.\n- Only third-party add-on DLLs built against legacy \`FreeTrainSimulator.*\` assemblies require rebuilding.\n- Older saves have not been fully verified.\n- Known route-content issue: the signal between Quilmes and Ezpeleta can display green while the route treats it as red."
                ;;
              *)
                printf '%b\n' "Stable portable Linux build of ${release_sha}, with bundled .NET runtime.\n\nBundled Riel assemblies use the \`Riel.*\` names; only third-party add-on DLLs built against legacy \`FreeTrainSimulator.*\` assemblies require rebuilding."
                ;;
            esac
          }

          # Keep the published stable changelogs accurate without moving their
          # already-tested tags or replacing their assets.
          for published_tag in v0.1.0 v0.1.1 v0.1.2; do
            if gh release view "$published_tag" >/dev/null 2>&1; then
              published_sha="$(git rev-list -n 1 "$published_tag")"
              published_version="${published_tag#v}"
              published_notes="$(release_notes "$published_tag" "$published_sha")"
              gh release edit "$published_tag" --title "Riel $published_version" --notes "$published_notes"
            fi
          done

          tag="v$version"
          title="Riel $version"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Keep the already-tested tag and assets immutable, but allow release-note
            # corrections without publishing a new binary.
            target_sha="$(git rev-list -n 1 "$tag")"
            notes="$(release_notes "$tag" "$target_sha")"
            gh release edit "$tag" --latest --title "$title" --notes "$notes"
            echo "Stable release $tag already exists; updated notes only, leaving tested commit and assets unchanged"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag exists without a release; refusing to move it" >&2
            exit 1
          fi
          notes="$(release_notes "$tag" "$GITHUB_SHA")"
          gh release create "$tag" \
            "${RUNNER_TEMP}/riel-linux-x64.zip" \
            "${RUNNER_TEMP}/riel-linux-x64.zip.sha256" \
            "${RUNNER_TEMP}/riel-route-editor-source.tar.gz" \
            --target "$GITHUB_SHA" --latest --title "$title" --notes "$notes"
