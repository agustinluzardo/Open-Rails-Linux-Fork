<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="700" viewBox="0 0 1060 700" role="img" aria-label="Vista ilustrativa del launcher de Riel con el nuevo panel de detalles">
  <defs>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#21364a"/>
      <stop offset="1" stop-color="#0e1826"/>
    </linearGradient>
    <clipPath id="window"><rect width="1060" height="700" rx="10"/></clipPath>
    <clipPath id="detail"><rect x="351" y="506" width="678" height="114"/></clipPath>
  </defs>
  <g clip-path="url(#window)" font-family="DejaVu Sans, sans-serif">
    <rect width="1060" height="700" fill="#0b0c0e"/>
    <rect width="1060" height="72" fill="#101216"/>
    <path d="M0 71H1060M0 644H1060" stroke="#32353a"/>
    <rect x="20" y="15" width="41" height="41" rx="9" fill="url(#icon)"/>
    <circle cx="41" cy="26" r="3" fill="#ffbd3c"/>
    <path d="M39 30L30 51M43 30L52 51M35 40H47M31 49H51" stroke="#b9cddc" stroke-width="1.5"/>
    <text x="72" y="35" font-weight="bold" font-size="23" fill="#f6f9fc">Riel</text>
    <text x="72" y="54" font-size="12" fill="#aab6c5">Microsoft Train Simulator routes, natively on Linux</text>
    <rect x="690" y="20" width="42" height="24" rx="12" fill="#0078d4"/>
    <circle cx="719" cy="32" r="8" fill="white"/>
    <text x="741" y="37" fill="#e7edf5" font-size="14">Dark</text>
    <rect x="785" y="19" width="117" height="31" rx="3" fill="#2a2b2e"/>
    <text x="797" y="40" fill="#f3f5f8" font-size="13">Content folders</text>
    <rect x="913" y="19" width="55" height="31" rx="3" fill="#2a2b2e"/>
    <text x="925" y="40" fill="#f3f5f8" font-size="13">Tools</text>
    <rect x="976" y="19" width="68" height="31" rx="3" fill="#2a2b2e"/>
    <text x="985" y="40" fill="#f3f5f8" font-size="13">Settings</text>

    <text x="16" y="101" font-weight="bold" font-size="16" fill="#fafbff">Routes</text>
    <rect x="16" y="112" width="307" height="32" rx="3" fill="none" stroke="#72777e"/>
    <text x="26" y="133" font-size="13" fill="#79818d">Search routes</text>
    <rect x="16" y="152" width="307" height="58" fill="#185d92"/>
    <text x="28" y="177" font-size="14" font-weight="bold" fill="white">Riel Test Line</text>
    <text x="28" y="195" font-size="12" fill="#d0e7ff">Test</text>
    <rect x="16" y="210" width="307" height="422" fill="#292a2d"/>

    <text x="338" y="102" font-size="16" font-weight="bold" fill="#f7faff">Riel Test Line</text>
    <text x="338" y="122" font-size="13" fill="#bbc4cc">A small synthetic route: a straight line, two activities, two paths, and folders in</text>
    <text x="338" y="140" font-size="13" fill="#bbc4cc">capitals the way a copy off a Windows disk has them.</text>
    <text x="350" y="184" font-size="25" fill="#f8faff">Activity</text>
    <text x="466" y="184" font-size="25" fill="#b5b5b8">Explore</text>
    <text x="585" y="184" font-size="25" fill="#b5b5b8">Timetable</text>
    <path d="M350 197H444" stroke="#199cf9" stroke-width="3"/>
    <rect x="350" y="211" width="682" height="56" fill="#185d92"/>
    <text x="362" y="235" font-size="14" font-weight="bold" fill="white">Morning coal run</text>
    <text x="362" y="253" font-size="12" fill="#cfeaff">08:30 · Summer · Clear · Medium · 1 h 20 min</text>
    <rect x="350" y="267" width="682" height="64" fill="#292a2d"/>
    <text x="362" y="293" font-size="14" font-weight="bold" fill="#f2f6fb">Night freight in the snow</text>
    <text x="362" y="311" font-size="12" fill="#ccd1d8">22:15 · Winter · Snow · Hard · 45 min</text>
    <rect x="350" y="331" width="682" height="151" fill="#0b0c0e"/>

    <rect x="350" y="495" width="682" height="137" rx="6" fill="#292a2d"/>
    <g clip-path="url(#detail)">
      <text x="362" y="521" font-size="14" font-weight="bold" fill="#f5f8fa">Morning coal run</text>
      <text x="362" y="541" font-size="12" fill="#dbe2e9">08:30 · Summer · Clear · Medium · 1 h 20 min</text>
      <text x="362" y="561" font-size="12" fill="#c9d2dd">Starting at Mine · Heading towards Port</text>
      <text x="362" y="582" font-size="12" fill="#e1e5ec">Take a loaded coal train from the mine down to the port.</text>
      <text x="362" y="606" font-size="12" fill="#bfcbd8">Train: Test Consist · Locomotive: TESTLOCO</text>
    </g>
    <rect x="1024" y="509" width="3" height="62" rx="1.5" fill="#555a60"/>

    <text x="20" y="674" font-size="13" fill="#d8dfe7">1 route in 1 content folder.</text>
    <rect x="712" y="656" width="169" height="30" rx="3" fill="#292a2d"/>
    <text x="727" y="676" font-size="13" fill="#bfc4ca">Continue saved game</text>
    <rect x="891" y="656" width="149" height="30" rx="3" fill="#0078d4"/>
    <text x="947" y="676" font-size="14" font-weight="bold" fill="white">Play</text>
  </g>
</svg>
